# Joint drive gains of the robot (same values as biped_hardware/config/joint_gains.yaml of the ROS 2
# project), used by demos/biped_walking.cpp with torque_mode: false. The drive law, every physics step:
#
#   tau = kp * (pos_target - q) + kd * (vel_target - dq) + tau_ff   [Nm, rad, rad/s]
#
# The WBC reads the same gains for its PVT feedforward (tau_ff = TSID torque - drive PD).
# Ankles: the gains of the MOTOR each ankle joint carries. The MJCF ankle is a serial roll / pitch
# chain (the linkage is not simulated): with a `robot` section both ankle joints use the sum of the
# two ankle motors' gains. A file without that section is used as joint gains as they are.
robot:
  left_hip_pitch_joint:    {kp: 120.0, kd: 1.20}   # MD 10
  left_hip_roll_joint:     {kp: 150.0, kd: 1.5}    # MD 20
  left_hip_yaw_joint:      {kp: 80.0,  kd: 0.75}   # MD 30
  left_knee_pitch_joint:   {kp: 100.0, kd: 0.5}    # MD 40
  left_ankle_roll_joint:   {kp: 30.0,  kd: 0.15}    # MD 50 (upper ankle motor)
  left_ankle_pitch_joint:  {kp: 30.0,  kd: 0.15}    # MD 60 (lower ankle motor)

  right_hip_pitch_joint:   {kp: 120.0, kd: 1.20}   # MD 70
  right_hip_roll_joint:    {kp: 150.0, kd: 1.5}    # MD 80
  right_hip_yaw_joint:     {kp: 80.0,  kd: 0.75}   # MD 90
  right_knee_pitch_joint:  {kp: 100.0, kd: 0.5}    # MD 100
  right_ankle_roll_joint:  {kp: 30.0,  kd: 0.15}    # MD 110 (upper ankle motor)
  right_ankle_pitch_joint: {kp: 30.0,  kd: 0.15}    # MD 120 (lower ankle motor)
